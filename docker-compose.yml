services:
  postgres:
    image: postgres:16-alpine
    container_name: rda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: rda-backend
    restart: unless-stopped
    environment:
      # Inside the container network the database host is the `postgres`
      # service, never `localhost` (which would point at the container
      # itself). The .env DATABASE_URL is for local, non-Docker use (RDA-056).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Inject the OpenAI-compatible key so the container does not fall back
      # to the placeholder in backend/.env (RDA-056).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # host.docker.internal is Docker Desktop's stable name for the host
      # (RDA-067): a hardcoded gateway IP here silently broke embeddings
      # (connection refused -> relevance filtering fails closed with no
      # filtering at all, not an error) whenever that IP drifted. This is
      # EMBEDDING_BASE_URL (not the more common OPENAI_BASE_URL) precisely
      # because that generic name is easy to already have set ambiently in
      # a shell/host environment for unrelated tooling, which would
      # otherwise silently redirect embeddings there instead.
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mxbai-embed-large}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # Multi-source search (RDA-066)
      SEARCH_PROVIDERS: ${SEARCH_PROVIDERS:-openalex,crossref,semantic_scholar,arxiv,europe_pmc,core}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - rda-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: rda-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rda-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  rda-net:
    driver: bridge

volumes:
  postgres_data:






